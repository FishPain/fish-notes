name: Release

# Manual-only CD: build the macOS DMG and publish it as a GitHub release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (default: v<version> from app/package.json)"
        required: false
        default: ""

permissions:
  contents: write # create releases + upload assets

jobs:
  release:
    runs-on: macos-latest # electron-builder needs macOS to produce a .dmg
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Build DMG (ad-hoc signed)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # no signing identity; match local ad-hoc build
        run: npm run package
      - name: Resolve release tag
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="${INPUT_TAG:-v$VERSION}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          NOTES="Automated release. macOS DMG is ad-hoc signed — on first launch, right-click the app → Open to bypass Gatekeeper."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.dmg --clobber
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Fish Notes $TAG" --notes "$NOTES" dist/*.dmg
          fi
