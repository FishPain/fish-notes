name: Release

# CD: build the macOS DMG and publish it as a GitHub release. Trigger either by
# pushing a v* tag (e.g. `git tag v0.2.0 && git push origin v0.2.0`) or manually.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (default: v<version> from app/package.json)"
        required: false
        default: ""

permissions:
  contents: write # create releases + upload assets

jobs:
  release:
    runs-on: macos-latest # electron-builder needs macOS to produce a .dmg
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Build DMG (ad-hoc signed)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # no signing identity; match local ad-hoc build
        run: npm run package
      - name: Resolve release tag
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"           # triggered by pushing a v* tag
          else
            VERSION=$(node -p "require('./package.json').version")
            TAG="${INPUT_TAG:-v$VERSION}"    # manual run: input, else package.json version
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-run on an existing tag: just refresh the DMG, keep the notes.
            gh release upload "$TAG" dist/*.dmg --clobber
          else
            # Changelog: GitHub auto-generates "what changed" from PRs/commits merged
            # since the previous release. Written to a file to avoid shell-escaping PR titles.
            CAVEAT="macOS DMG is ad-hoc signed — on first launch, right-click the app → Open to bypass Gatekeeper."
            CHANGELOG=$(gh api "repos/$REPO/releases/generate-notes" -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" --jq .body)
            printf '%s\n\n%s\n' "$CAVEAT" "$CHANGELOG" > /tmp/release-notes.md
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Fish Notes $TAG" --notes-file /tmp/release-notes.md dist/*.dmg
          fi
